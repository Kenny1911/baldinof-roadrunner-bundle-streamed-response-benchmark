services:
    app-rr:
        build:
            dockerfile: Dockerfile
            target: app-rr
        restart: always
        ports:
            - "${APP_RR_PORT:-127.0.0.1:8000}:8080"
        #volumes:
        #    - ./src:/var/www/html/src
        #    - ./config:/var/www/html/config
        #    - ./.rr.yaml:/var/www/html/.rr.yaml
        cpus: "4.0"
        mem_limit: 1g

    app-rr-fork:
        build:
            dockerfile: Dockerfile
            target: app-rr-fork
        restart: always
        ports:
            - "${APP_RR_FORK_PORT:-127.0.0.1:8001}:8080"
        #volumes:
        #    - ./src:/var/www/html/src
        #    - ./config:/var/www/html/config
        #    - ./.rr.yaml:/var/www/html/.rr.yaml
        cpus: "4.0"
        mem_limit: 1g

    app-fpm:
        build:
            dockerfile: Dockerfile
            target: app-fpm
        restart: always
        #volumes:
        #    - ./src:/var/www/html/src
        #    - ./config:/var/www/html/config
        #    - ./.rr.yaml:/var/www/html/.rr.yaml
        cpus: "4.0"
        mem_limit: 1g

    app-fpm-nginx:
        image: nginx:1.29.4-alpine
        restart: always
        depends_on:
            - app-fpm
        ports:
            - "${APP_FPM_PORT:-127.0.0.1:8002}:80"
        volumes:
            - ./public/:/var/www/html/public:ro
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        cpus: "1.0"
        mem_limit: 128m
